name: Build ZWall (Windows + Linux)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_STRICT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    name: Windows x64 (NSIS installer)
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ". -> target"
          key: windows-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle mpv.exe for video wallpapers
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = gh api repos/zhongfly/mpv-winbuild/releases/latest --jq '.assets[] | select(.name | test("^mpv-x86_64-[0-9].*\\.7z$")) | .browser_download_url' | Select-Object -First 1
          if (-not $asset) { Write-Warning "No mpv build found; the installer will ask users to install mpv"; exit 0 }
          Write-Host "mpv: $asset"
          Invoke-WebRequest -Uri $asset -OutFile mpv.7z
          7z x mpv.7z -ompv -y | Out-Null
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item (Get-ChildItem -Recurse mpv -Filter mpv.exe | Select-Object -First 1).FullName src-tauri/binaries/mpv.exe

      - name: Rust tests (on real Windows)
        continue-on-error: true
        run: cargo test --workspace --locked

      - name: Build the engine
        run: cargo build -p zwall-engine --release --locked

      - name: Place the engine next to the app and write the packaging config
        shell: pwsh
        run: |
          $bins = "src-tauri/binaries"
          New-Item -ItemType Directory -Force $bins | Out-Null
          Copy-Item target/release/zwall-engine.exe "$bins/zwall-engine-x86_64-pc-windows-msvc.exe"
          $resources = @{}
          Get-ChildItem target/release -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "$bins/$($_.Name)"
            $resources["binaries/$($_.Name)"] = $_.Name
          }
          if (Test-Path "$bins/mpv.exe") { $resources["binaries/mpv.exe"] = "mpv.exe" }

          # The engine (and onnxruntime inside it) links the MSVC C++ runtime dynamically.
          # Ship it app-locally so the engine starts on PCs without the VC++ Redistributable.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Sort-Object { try { [version]$_.Name } catch { [version]"0.0" } } -Descending |
            ForEach-Object { Get-ChildItem "$($_.FullName)\x64" -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $crt) { Write-Error "MSVC runtime redist folder not found under $vs"; exit 1 }
          Write-Host "VC++ runtime: $($crt.FullName)"
          Get-ChildItem $crt.FullName -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName "$bins/$($_.Name)"
            $resources["binaries/$($_.Name)"] = $_.Name
          }

          # Every DLL the engine imports must be part of Windows or shipped next to it.
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $imports = & $dumpbin.FullName /nologo /dependents target/release/zwall-engine.exe | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
          $system = @("kernel32","user32","gdi32","advapi32","shell32","ole32","oleaut32","ntdll","dwmapi","dxgi","d3d11","d3d12","d3dcompiler_47","opengl32","setupapi","ws2_32","bcrypt","bcryptprimitives","dbghelp","combase","comctl32","shlwapi","imm32","uxtheme","version","winmm","crypt32","secur32","userenv","propsys","powrprof","shcore","avrt","mfplat","mfreadwrite","mf","ncrypt","iphlpapi","psapi","winhttp","wininet","normaliz","cfgmgr32","hid","dinput8","xinput1_4","netapi32","wtsapi32","mmdevapi","ksuser","dcomp","d2d1","dwrite","windowscodecs","api-ms-win-*","ext-ms-*")
          $missing = $imports | Where-Object {
            $dll = $_.ToLower()
            $base = $dll -replace '\.dll$', ''
            -not ($system | Where-Object { $base -like $_ }) -and -not (Test-Path "$bins/$dll")
          }
          Write-Host "zwall-engine.exe imports: $($imports -join ', ')"
          if ($missing) { Write-Error "zwall-engine.exe needs DLLs that are neither part of Windows nor shipped: $($missing -join ', ')"; exit 1 }
          $bundle = @{ targets = @("nsis"); externalBin = @("binaries/zwall-engine") }
          if ($resources.Count -gt 0) { $bundle.resources = $resources }
          @{ bundle = $bundle } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 src-tauri/tauri.release.conf.json
          Get-Content src-tauri/tauri.release.conf.json

      - name: Build installer (NSIS)
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json

      - name: Check the installed engine starts
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "zwall-install"
          Start-Process $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait
          Get-ChildItem $dir | Select-Object Name, Length
          foreach ($f in @("zwall.exe", "zwall-engine.exe", "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "DirectML.dll")) {
            if (-not (Test-Path (Join-Path $dir $f))) { Write-Error "The installer didn't install $f next to the app"; exit 1 }
          }
          # 'ctl pause' loads every DLL, then exits 1 because no engine is running.
          # A loader failure would be 0xC0000135 (-1073741515) or similar instead.
          $p = Start-Process (Join-Path $dir "zwall-engine.exe") -ArgumentList "ctl", "pause" -Wait -PassThru -NoNewWindow
          Write-Host "zwall-engine ctl pause exited with $($p.ExitCode)"
          if ($p.ExitCode -ne 1) { Write-Error ("zwall-engine.exe didn't start (exit 0x{0:X8})" -f $p.ExitCode); exit 1 }

      - name: List bundle output
        if: always()
        shell: pwsh
        run: Get-ChildItem -Recurse target -Include *.exe -ErrorAction SilentlyContinue | Where-Object FullName -match 'bundle' | Select-Object FullName, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux x86_64 (.deb + .rpm)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file patchelf rpm \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libmpv-dev libwayland-dev libxkbcommon-dev libegl-dev

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ". -> target"
          key: linux-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build the engine
        run: cargo build -p zwall-engine --release --locked

      - name: Place the engine next to the app and write the packaging config
        run: |
          mkdir -p src-tauri/binaries
          install -m 755 target/release/zwall-engine src-tauri/binaries/zwall-engine-x86_64-unknown-linux-gnu
          cat > src-tauri/tauri.release.conf.json <<'JSON'
          {
            "bundle": {
              "targets": ["deb", "rpm"],
              "externalBin": ["binaries/zwall-engine"],
              "linux": {
                "deb": { "depends": ["libmpv2", "libwayland-egl1", "libxcb1", "libstdc++6", "libwebkit2gtk-4.1-0"], "recommends": ["ffmpeg", "libjxl-tools"] },
                "rpm": { "depends": ["mpv-libs", "libwayland-egl", "libxcb", "libstdc++", "webkit2gtk4.1"], "recommends": ["ffmpeg", "libjxl-utils"] }
              }
            }
          }
          JSON

      - name: Build packages (.deb + .rpm)
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json

      - name: Check the engine ships executable
        run: |
          for deb in target/release/bundle/deb/*.deb; do
            dpkg-deb -c "$deb" | grep -E '^-rwxr-xr-x .*usr/bin/zwall-engine$' || { echo "::error::$deb ships usr/bin/zwall-engine without the execute bit"; exit 1; }
          done
          for rpm in target/release/bundle/rpm/*.rpm; do
            rpm -qlvp "$rpm" | grep -E '^-rwxr-xr-x .*/usr/bin/zwall-engine$' || { echo "::error::$rpm ships /usr/bin/zwall-engine without the execute bit"; exit 1; }
          done

      - name: Check the packaged engine starts
        run: |
          dir=$(mktemp -d)
          dpkg-deb -x target/release/bundle/deb/*.deb "$dir"
          if ldd "$dir/usr/bin/zwall-engine" | grep 'not found'; then echo "::error::zwall-engine needs libraries that aren't installed"; exit 1; fi
          # 'ctl pause' loads everything, then exits 1 because no engine is running.
          set +e
          out=$(XDG_RUNTIME_DIR="$dir" "$dir/usr/bin/zwall-engine" ctl pause 2>&1); code=$?
          set -e
          echo "zwall-engine ctl pause exited with $code: $out"
          [ "$code" = 1 ] && grep -q "isn't running" <<<"$out" || { echo "::error::the packaged zwall-engine doesn't start"; exit 1; }

      - name: List bundle output
        if: always()
        run: find target -type f \( -name '*.deb' -o -name '*.rpm' \) -path '*bundle*' -exec ls -la {} \; 2>/dev/null || true

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Draft release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building draft for v$VERSION"

      - name: Refuse to touch an already-published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name==\"$TAG\" and .draft==false)] | length")
          if [ "$PUBLISHED" != "0" ]; then
            echo "::error::A published release $TAG already exists. Bump the version in src-tauri/tauri.conf.json, package.json and the root Cargo.toml first."
            exit 1
          fi

      - name: Remove any previous draft for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          for ID in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\" and .draft==true) | .id"); do
            echo "Deleting stale draft release $ID"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"
          done

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect installers
        run: |
          mkdir -p release
          find dist -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release/ \;
          test -n "$(ls -A release)" || { echo "::error::No installers found"; exit 1; }
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -lah release/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ZWall ${{ steps.meta.outputs.tag }}
          draft: true
          prerelease: false
          files: release/*
          body: |
            **Draft.** Installers for ZWall ${{ steps.meta.outputs.tag }}:

            - **Windows 10/11:** `ZWall_${{ steps.meta.outputs.version }}_x64-setup.exe`
            - **Debian / Ubuntu / Mint:** `ZWall_${{ steps.meta.outputs.version }}_amd64.deb`
            - **Fedora / openSUSE:** `ZWall-${{ steps.meta.outputs.version }}-1.x86_64.rpm`
            - `SHA256SUMS.txt` to verify the downloads

            Downloads for users: https://zsync.eu/zwall/
