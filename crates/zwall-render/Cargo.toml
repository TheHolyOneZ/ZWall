[package]
name = "zwall-render"
description = "ZWall GPU pipelines: shader presets, photo texture, later video and parallax mesh (wgpu + WGSL)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
wgpu = "30"
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
