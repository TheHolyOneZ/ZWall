[package]
name = "zwall"
description = "ZWall: live wallpapers you can actually make"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "zwall_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zwall-format = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
zwall-ipc = { workspace = true }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# KDE Plasma (X11): ask KWin to blur what's behind the ZWall window.
x11rb = { version = "0.14", features = ["allow-unsafe-code"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
